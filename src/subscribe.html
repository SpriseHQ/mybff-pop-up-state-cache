<script>
    Webflow.push(function() {
        $('.copyright-year').text(new Date().getFullYear());
    });

    var USE_REF_TRACKING = true;

    var setHasSubscribed = function (event) {
        try {
            localStorage.setItem('hasSignedUpToNewsletter', "true");
        } catch (error) {
            console.warn(error);
        }

        if (USE_REF_TRACKING) {
            try {
                trackReferrerIfAvailable();
            } catch (error) {
                console.error(error);
            }
        }

    };

    var trackReferrerIfAvailable = function () {
        var campaign = window.campaign;
        if (campaign) {
            var emailAddress = document.getElementById('email');
            if (emailAddress.validity.valid) {
                campaign.identify({email: emailAddress.value});
            }
        }
    };

    window.addEventListener('load', function () {
        var btns = document.getElementsByClassName("subscribe-button");
        for (var btn of btns) {
            btn.addEventListener('click', setHasSubscribed);
        }
    }, false);
</script>
